name: მონაცემების განახლება

on:
  schedule:
    - cron: "17 3 * * *"   # ყოველდღე 07:17 თბილისის დროით
    - cron: "17 13 * * *"  # და 17:17-ზე (კოეფიციენტები და შემადგენლობები განახლდეს)
  workflow_dispatch:
    inputs:
      max_req:
        description: "მაქსიმუმ რამდენი მოთხოვნა (ცარიელი = config.json)"
        required: false
        default: ""
      archive_season:
        description: "არქივის სეზონი (მაგ. 2025) — ცარიელი = მიმდინარე სეზონი"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: მონაცემების წამოღება
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MAX_REQ: ${{ github.event.inputs.max_req }}
          ARCH: ${{ github.event.inputs.archive_season }}
        run: |
          if [ -n "$ARCH" ]; then
            SEASON="$ARCH" DATA_DIR="data/archive/$ARCH" SKIP_H2H=1 python scripts/fetch.py
          else
            python scripts/fetch.py
          fi
      - name: შენახვა რეპოში
        run: |
          git config user.name "sportstats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "ცვლილება არ არის" && exit 0
          git commit -m "მონაცემები $(date -u +%Y-%m-%d)"
          git push
